[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imlresi"
version = "0.0.46"
description = "Tools for dealing with IML-Resi PowerDrill data."
readme = "README.md"
authors = [
    { name = "Jonathan Harrington", email = "jh@aliente.ch" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "ujson",
    "requests",
    "certifi",
    "loguru",
    "numpy <2.0, >1.24.4",
    "pandas",
    "rdata",
    "duckdb"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]

[project.scripts]
traces2resi = "imlresi.dotresi:main"

[project.urls]
Homepage = "https://github.com/hammockman/imlresi-pypi"
"Issue Tracker" = "https://github.com/hammockman/imlresi-pypi/issues"

[project.optional-dependencies]
# Delta Lake export with the pure-Python delta-rs engine
delta = [
    "deltalake",
    "pyarrow",
]
# Delta Lake export through PySpark (e.g. Microsoft Fabric notebooks)
spark = [
    "pyspark",
    "delta-spark",
]
# Trace.plot()
plot = [
    "matplotlib",
]
test = [
    "pytest",
    "jsondiff",
    "deltalake",
    "pyarrow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
