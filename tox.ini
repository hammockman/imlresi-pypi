# content of: tox.ini , put in same dir as setup.py
#[tox]
#envlist = py314

[testenv]
# install the package with its test extra (pytest, jsondiff, deltalake, ...)
extras = test
commands =
    # NOTE: you can run any command line tool here - not just tests
    pytest


[testenv:lint]
description = Run code and documentation linting
deps =
    flake8
    mypy
    pre-commit
commands =
    flake8 imlresi
    mypy imlresi
    pre-commit run --all-files --show-diff-on-failure